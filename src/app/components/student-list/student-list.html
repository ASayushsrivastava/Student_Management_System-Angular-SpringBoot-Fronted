<div class="list-container">
  <div class="list-header">
    <h3 class="list-title">Students</h3>
    <span class="list-count">{{ students().length }} total</span>
  </div>

  <table>
    <thead>
      <tr>
        <th>First</th>
        <th>Last</th>
        <th>Email</th>
        <th>Age</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      @for (s of students(); track s.id) {
      <tr
        (click)="selectRow(s.id!)"
        [class.active]="selectedId() === s.id"
        [class.deleting]="deletingId() === s.id"
      >
        <td>{{ s.firstName }}</td>
        <td>{{ s.lastName }}</td>
        <td class="email">{{ s.email }}</td>
        <td>
          <span class="age-pill">{{ s.age }}</span>
        </td>
        <td class="actions">
          <button class="edit" (click)="editStudent(s.id!)">Edit</button>
          <button class="delete" (click)="deleteStudent(s.id!)">Delete</button>
        </td>
      </tr>
      } @empty {
      <tr>
        <td colspan="5" class="empty">No students found</td>
      </tr>
      }
    </tbody>
  </table>
</div>
